<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Pide tu presupuesto · Mudanzas del Sur</title>
<meta name="description" content="Presupuesto de mudanza gratis en Huelva, Sevilla y toda Andalucía. Contesta unas preguntas con botones y te respondemos por WhatsApp en el día." />
<meta property="og:title" content="Pide tu presupuesto de mudanza · Mudanzas del Sur" />
<meta property="og:description" content="Gratis y en 2 minutos. Te contestamos por WhatsApp en el día." />
<meta property="og:type" content="website" />
<meta name="theme-color" content="#c2410c" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet" />
<style>
  :root{
    --bg:#fbf5ec; --card:#ffffff; --ink:#1d2433; --muted:#5b6474; --line:#e6dccd;
    --accent:#c2410c; --accentHi:#f97316; --accentSoft:#fff1e4; --ok:#15803d; --okSoft:#e8f6ec;
    --danger:#b91c1c; --wa:#128c4a;
    --radius:16px; --font:'Nunito',system-ui,-apple-system,'Segoe UI',sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{font-family:var(--font);background:var(--bg);color:var(--ink);font-size:19px;line-height:1.45;min-height:100dvh;display:flex;flex-direction:column}
  button,input,textarea{font:inherit;color:inherit}
  button{cursor:pointer}
  :focus-visible{outline:3px solid var(--accentHi);outline-offset:2px}
  .wrap{width:100%;max-width:560px;margin:0 auto;padding:0 16px}

  /* Cabecera */
  header{background:var(--ink);color:#fff;padding:14px 0 12px}
  .brand{display:flex;align-items:center;gap:10px;font-weight:900;font-size:1.05rem;letter-spacing:.2px}
  .brand .truck{font-size:1.5rem}
  .brand small{display:block;font-weight:600;font-size:.78rem;opacity:.75;letter-spacing:0}
  .progress{margin-top:12px;display:none}
  .progress.on{display:block}
  .progress-label{font-size:.85rem;opacity:.85;margin-bottom:5px}
  .bar{height:8px;border-radius:99px;background:rgba(255,255,255,.18);overflow:hidden}
  .bar i{display:block;height:100%;width:0;background:var(--accentHi);border-radius:99px;transition:width .25s}

  main{flex:1;padding:22px 0 150px}
  h1{font-size:1.6rem;line-height:1.2;font-weight:900;margin-bottom:8px}
  h1:focus{outline:none}
  .help{color:var(--muted);margin-bottom:18px;font-size:1rem}
  h2{font-size:1.15rem;font-weight:800;margin:22px 0 10px}

  /* Opciones grandes */
  .opts{display:grid;gap:10px}
  .opts.two{grid-template-columns:1fr 1fr}
  .opts.three{grid-template-columns:repeat(3,1fr)}
  .opt{display:flex;align-items:center;gap:12px;width:100%;min-height:64px;padding:12px 16px;text-align:left;background:var(--card);border:2px solid var(--line);border-radius:var(--radius);font-weight:800;font-size:1.05rem;transition:border-color .15s,background .15s}
  .opt .em{font-size:1.6rem;flex:none;width:34px;text-align:center}
  .opt small{display:block;font-weight:600;color:var(--muted);font-size:.88rem}
  .opt.center{justify-content:center;text-align:center}
  .opt[aria-pressed="true"]{border-color:var(--accent);background:var(--accentSoft);box-shadow:inset 0 0 0 1px var(--accent)}
  .opt[aria-pressed="true"]::after{content:"✓";margin-left:auto;color:var(--accent);font-weight:900;font-size:1.3rem}
  .opt.center[aria-pressed="true"]::after{margin-left:6px}
  .opts.two .opt{min-height:72px}

  /* Contadores de muebles */
  .counters{display:grid;gap:8px}
  .grupo{font-size:.95rem;font-weight:900;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:18px 0 8px}
  .grupo:first-of-type{margin-top:4px}
  .counter{background:var(--card);border:2px solid var(--line);border-radius:var(--radius);padding:8px 10px}
  .ct-row{display:flex;align-items:center;gap:10px}
  .ct-label small{display:block;font-weight:600;color:var(--muted);font-size:.85rem}
  .ct-det{display:block;width:100%;margin-top:8px;min-height:48px;padding:10px 12px;font-size:1rem;background:#fff;border:2px solid var(--line);border-radius:12px}
  .ct-det:focus{border-color:var(--accent);outline:none}
  .counter.on{border-color:var(--accent);background:var(--accentSoft)}
  .counter .em{font-size:1.4rem;width:30px;text-align:center;flex:none}
  .ct-label{flex:1;font-weight:800;font-size:1rem;line-height:1.2}
  .ct-btn{width:48px;height:48px;border-radius:12px;border:2px solid var(--line);background:#fff;font-size:1.5rem;font-weight:900;color:var(--ink);flex:none}
  .ct-btn:disabled{opacity:.35}
  .ct-n{min-width:28px;text-align:center;font-weight:900;font-size:1.2rem}

  /* Campos */
  .field{margin-bottom:16px}
  .field label{display:block;font-weight:800;margin-bottom:6px}
  .field label small{font-weight:600;color:var(--muted)}
  .field input,.field textarea{width:100%;min-height:58px;padding:14px 16px;font-size:1.1rem;background:var(--card);border:2px solid var(--line);border-radius:var(--radius)}
  .field textarea{min-height:120px;resize:vertical}
  .field input:focus,.field textarea:focus{border-color:var(--accent);outline:none}
  .field .err{color:var(--danger);font-weight:700;font-size:.95rem;margin-top:6px}

  /* Fotos */
  .photo-btns{display:grid;gap:10px;grid-template-columns:1fr 1fr}
  .photo-btn{min-height:96px;flex-direction:column;justify-content:center;text-align:center;gap:4px}
  .photo-btn .em{font-size:2rem;width:auto}
  .thumbs{display:grid;gap:10px;margin-top:14px}
  .thumb{display:grid;grid-template-columns:96px 1fr;gap:10px;align-items:start;background:var(--card);border:2px solid var(--line);border-radius:var(--radius);padding:8px}
  .thumb-img{position:relative;width:96px;height:96px;border-radius:10px;overflow:hidden;background:#eee}
  .thumb img{width:100%;height:100%;object-fit:cover}
  .thumb-img button{position:absolute;top:4px;right:4px;width:32px;height:32px;border-radius:50%;border:none;background:rgba(0,0,0,.65);color:#fff;font-size:1rem}
  .thumb label{display:block;font-weight:800;font-size:.9rem;margin-bottom:4px}
  .thumb textarea{width:100%;min-height:68px;padding:8px 10px;font-size:1rem;border:2px solid var(--line);border-radius:10px;resize:vertical}
  .thumb textarea:focus{border-color:var(--accent);outline:none}
  .tip{background:var(--accentSoft);border-radius:var(--radius);padding:12px 14px;font-size:.98rem;margin-bottom:16px}
  .tip b{display:block;margin-bottom:2px}

  /* Repaso */
  .rev{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:4px 14px;margin-bottom:12px}
  .rev-item{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line)}
  .rev-item:last-child{border-bottom:none}
  .rev-item div{flex:1;min-width:0}
  .rev-item dt{font-size:.85rem;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
  .rev-item dd{margin:2px 0 0;font-weight:700;white-space:pre-line;overflow-wrap:anywhere}
  .rev-item dd.vacio{color:var(--muted);font-weight:600;font-style:italic}
  .rev-item button{flex:none;background:none;border:2px solid var(--line);border-radius:12px;padding:8px 12px;font-weight:800;color:var(--accent);font-size:.95rem}
  .count{margin-top:10px;font-weight:800;color:var(--ok)}
  .busy{margin-top:10px;color:var(--muted);font-weight:700}

  /* Barra inferior */
  .actions{position:fixed;left:0;right:0;bottom:0;background:rgba(251,245,236,.97);border-top:1px solid var(--line);padding:12px 0 calc(12px + env(safe-area-inset-bottom))}
  .actions .row{display:flex;gap:10px}
  .btn{min-height:60px;border-radius:var(--radius);border:none;font-weight:900;font-size:1.15rem;padding:0 18px}
  .btn-main{flex:1;background:var(--accent);color:#fff}
  .btn-main:disabled{background:#d6c9b8;color:#fff}
  .btn-back{background:var(--card);border:2px solid var(--line);color:var(--ink);min-width:96px}
  .wa-help{display:block;text-align:center;margin-top:8px;font-size:.95rem;color:var(--wa);font-weight:800;text-decoration:none}
  .wa-help span{text-decoration:underline}

  /* Portada y final */
  .hero{background:var(--card);border-radius:22px;padding:24px 20px;border:1px solid var(--line)}
  .hero h1{font-size:1.85rem}
  .ticks{list-style:none;margin:16px 0 4px;display:grid;gap:8px}
  .ticks li{display:flex;gap:10px;font-weight:700}
  .ticks li::before{content:"✓";color:var(--ok);font-weight:900}
  .btn-block{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;margin-top:14px;text-decoration:none;text-align:center;padding:10px 18px}
  .btn-wa{background:var(--wa);color:#fff}
  .btn-ghost{background:transparent;border:2px solid var(--line);color:var(--ink)}
  .slogan{margin-top:18px;text-align:center;color:var(--muted);font-style:italic;font-size:.95rem}
  .done{text-align:center}
  .done .big{font-size:3.4rem}
  .alert{background:#fdecea;border:2px solid #f5c2bd;color:#7f1d1d;border-radius:var(--radius);padding:14px 16px;margin-top:16px;font-weight:700}
  .privacy{font-size:.85rem;color:var(--muted);margin-top:6px}
  .sending{position:fixed;inset:0;background:rgba(29,36,51,.55);display:none;align-items:center;justify-content:center;z-index:20;padding:16px}
  .sending.on{display:flex}
  .sending div{background:#fff;border-radius:20px;padding:26px 22px;text-align:center;font-weight:800;max-width:340px}
  .spin{width:44px;height:44px;border:5px solid var(--accentSoft);border-top-color:var(--accent);border-radius:50%;margin:0 auto 14px;animation:sp .8s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}
  .hp{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
  @media (max-width:360px){body{font-size:18px}.opts.three{grid-template-columns:1fr 1fr}}
  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="brand"><span class="truck" aria-hidden="true">🚚</span><div>Mudanzas del Sur<small>Huelva · Sevilla · toda Andalucía</small></div></div>
    <div class="progress" id="progress" aria-hidden="true">
      <div class="progress-label" id="progress-label"></div>
      <div class="bar"><i id="bar"></i></div>
    </div>
  </div>
</header>

<main><div class="wrap" id="step" aria-live="polite"></div></main>

<div class="actions" id="actions" hidden>
  <div class="wrap">
    <div class="row">
      <button class="btn btn-back" id="btn-back" type="button">‹ Atrás</button>
      <button class="btn btn-main" id="btn-next" type="button">Siguiente</button>
    </div>
    <a class="wa-help" id="wa-help" target="_blank" rel="noopener">¿Te lías? <span>Escríbenos por WhatsApp</span></a>
  </div>
</div>

<div class="sending" id="sending" role="alertdialog" aria-modal="true" aria-labelledby="sending-txt">
  <div><div class="spin"></div><p id="sending-txt">Enviando…</p></div>
</div>

<!-- Campo trampa para bots: las personas no lo ven -->
<div class="hp" aria-hidden="true"><label>Web <input id="hp-web" tabindex="-1" autocomplete="off" /></label></div>

<input type="file" id="in-camera" accept="image/*" capture="environment" multiple hidden />
<input type="file" id="in-gallery" accept="image/*" multiple hidden />

<script>
(() => {
'use strict';
// ── Ajustes ──
const WA = '34659715271';                 // WhatsApp de Mudanzas del Sur
const ENDPOINT = '/api/solicitud';
const MAX_FOTOS = 12, LADO = 1280, CALIDAD = 0.76;
const KEY = 'mds-presupuesto-v1';
const T0 = Date.now();

const waLink = t => `https://wa.me/${WA}?text=${encodeURIComponent(t)}`;
const WA_TXT = 'Hola, quiero pedir presupuesto para una mudanza 🙂';
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

// ── Estado (se guarda en el móvil por si cierra la página; las fotos no) ──
const S0 = () => ({servicios:[], casa:'', muebles:{}, mueblesDetalle:{}, mueblesTexto:'', desmontaje:'', embalaje:'', cajas:'', especiales:[],
         origen:{}, destino:{}, destinoNoSe:false, cuando:'', fecha:'', flexible:false, entrega:'',
         fotosWhatsapp:false, nombre:'', telefono:'', comentario:''});
let S = S0();
let fotos = [];          // [{id, data, nota}]  data = dataURL JPEG ya reducido
let paso = 0, enviando = false, procesando = 0;
let desdeRepaso = '';   // id del último paso a revisar antes de volver al repaso ('' = recorrido normal)
const HASTA = {origen:'origen-camion', destino:'destino-camion'};
try { const g = JSON.parse(localStorage.getItem(KEY) || 'null'); if (g && g.S) { S = {...S, ...g.S}; } } catch (e) {}
if (!S.mueblesDetalle || typeof S.mueblesDetalle !== 'object') S.mueblesDetalle = {};
const guardar = () => { try { localStorage.setItem(KEY, JSON.stringify({S})); } catch (e) {} };

const TOWNS = ['Huelva','Aljaraque','Punta Umbría','Cartaya','Lepe','Isla Cristina','Ayamonte','Gibraleón','San Juan del Puerto',
  'Moguer','Palos de la Frontera','Mazagón','El Portil','Nuevo Portil','El Rompido','Islantilla','Trigueros','Niebla','Bollullos Par del Condado',
  'La Palma del Condado','Almonte','Valverde del Camino','Villablanca','Sevilla','Dos Hermanas','Mairena del Aljarafe','Cádiz','Málaga','Madrid'];

const SERV = [
  ['mudanza','🏠','Mudanza completa','Llevar toda la casa o el piso'],
  ['porte','🛋️','Porte','Llevar algunos muebles o cosas sueltas'],
  ['montaje','🔧','Desmontar y montar muebles','Armarios, camas, cocinas…'],
  ['embalaje','📦','Embalar','Cajas, ropa, libros…'],
  ['fragil','🍽️','Vajilla y cosas frágiles','Cristal, espejos, cuadros…'],
  ['otro','✏️','Otra cosa','Nos lo cuentas más adelante'],
];
const CASAS = [['estudio','🛏️','Estudio'],['1','🏠','1 dormitorio'],['2','🏠','2 dormitorios'],['3','🏡','3 dormitorios'],['4','🏡','4 o más dormitorios'],['chalet','🏘️','Chalet o casa grande']];
// [clave, icono, nombre, aclaración, ejemplo para el detalle]
const GRUPOS = [
  ['Dormitorios', [
    ['camas','🛏️','Camas','Con su colchón','Ej.: 1 de matrimonio y 2 individuales'],
    ['canapes','🛏️','Canapés','Base de cama que se abre para guardar cosas','Ej.: 150 × 190'],
    ['somieres','🛏️','Somieres o bases con patas','Sin colchón','Ej.: 90 × 190, con patas'],
    ['colchones','🛏️','Colchones sueltos','','Ej.: 2 de 90 y 1 de 150'],
    ['armario2','🚪','Armarios de 1 o 2 puertas','','Ej.: uno con espejo'],
    ['armario4','🚪','Armarios de 3 o 4 puertas','','Ej.: de madera maciza'],
    ['armario6','🚪','Armarios de 5 o 6 puertas, o esquineros','','Ej.: esquinero de 2 metros'],
    ['comodas','🗄️','Cómodas, mesitas o estanterías','','Ej.: 2 mesitas y una cómoda'],
  ]],
  ['Salón y comedor', [
    ['sofas','🛋️','Sofás','Escribe las medidas o las plazas','Ej.: 2 de 160 cm y 1 de 120 cm'],
    ['sillones','💺','Sillones o butacas','','Ej.: un sillón relax'],
    ['mesas','🍽️','Mesas de comedor','','Ej.: de cristal, para 6'],
    ['mesascentro','☕','Mesas de centro o auxiliares','',''],
    ['sillas','🪑','Sillas','',''],
    ['muebletv','📺','Muebles de TV, aparadores o vitrinas','','Ej.: mueble de salón de 3 metros'],
    ['tv','📺','Televisores','','Ej.: uno de 65 pulgadas'],
  ]],
  ['Cocina y electrodomésticos', [
    ['frigorifico','🧊','Frigoríficos','','Ej.: uno americano'],
    ['lavadora','🧺','Lavadoras o secadoras','',''],
    ['electro','🔌','Otros electrodomésticos','Lavavajillas, horno, microondas…',''],
  ]],
  ['Terraza, jardín y otros', [
    ['jardin','🌿','Muebles de jardín o terraza','Cuenta cada pieza: sofá, butaca, mesa…','Ej.: sofá, 2 butacas y mesa baja de madera'],
    ['escritorios','🖥️','Escritorios','',''],
    ['bicis','🚲','Bicicletas','',''],
  ]],
];
const MUEBLES = GRUPOS.flatMap(g => g[1]);
const DESMONTAJE = [['si','🔧','Sí, desmontadlos y montadlos vosotros'],['desmontar','🪛','Solo desmontar'],['no','✅','No hace falta','Van montados o ya los desmonto yo'],['nose','🤷','No lo sé']];
const EMBALAJE = [['todo','📦','Embaláis vosotros todo','Cajas, ropa, vajilla…'],['fragil','🍽️','Solo lo frágil','Vajilla, cristal, cuadros…'],['yo','🙋','Lo embalo yo'],['nada','👍','No hay nada que embalar','Solo muebles']];
const CAJAS = [['10','','Menos de 10'],['30','','10 a 30'],['60','','30 a 60'],['mas','','Más de 60'],['nose','','No lo sé']];
const ESPECIALES = [['piano','🎹','Piano'],['caja-fuerte','🔒','Caja fuerte'],['nevera-americana','🧊','Nevera americana'],['pesado','🏋️','Algo de más de 100 kg'],
  ['plantas','🪴','Plantas grandes'],['arte','🖼️','Cuadros u obras de arte'],['nada','👍','Nada de esto']];
const PISOS = [['bajo','Bajo o casa'],['1','1º'],['2','2º'],['3','3º'],['4','4º o más']];
const ASC = [['si','Sí'],['no','No'],['nose','No lo sé']];
const PARK = [['puerta','🚚','En la puerta','Se puede parar justo delante'],['30','👣','Muy cerca','A menos de 30 metros'],
  ['100','🚶','Un poco lejos','Entre 30 y 100 metros'],['mas','🥾','Lejos','A más de 100 metros, o calle sin paso'],
  ['nose','🤷','No lo sé','Lo miramos nosotros']];
const ENTREGA = [['mismo','📦','El mismo día de la recogida'],['espera','🕒','Puede esperar unos días','Así podemos ajustarte el precio']];

// ── Pasos ──
const PASOS = [
  {id:'inicio', render: rInicio, sinBarra:true},
  {id:'servicios', render: rServicios},
  {id:'casa', render: rCasa, saltar: () => S.servicios.length > 0 && S.servicios.every(x => x === 'porte' || x === 'otro')},
  {id:'muebles', render: rMuebles},
  {id:'desmontaje', render: rDesmontaje},
  {id:'embalaje', render: rEmbalaje},
  {id:'especiales', render: rEspeciales},
  {id:'origen', render: () => rLugar('origen', '¿Dónde recogemos las cosas?', 'La dirección donde están ahora los muebles.')},
  {id:'origen-piso', render: () => rPiso('origen', '¿Cómo es la casa donde recogemos?')},
  {id:'origen-camion', render: () => rCamion('origen', '¿Dónde puede parar el camión al recoger?')},
  {id:'destino', render: () => rLugar('destino', '¿Dónde lo llevamos?', 'La dirección donde hay que dejarlo todo. Si todavía no lo sabes, pulsa «Aún no lo sé».')},
  {id:'destino-piso', render: () => rPiso('destino', '¿Cómo es la casa donde lo llevamos?'), saltar: () => S.destinoNoSe},
  {id:'destino-camion', render: () => rCamion('destino', '¿Dónde puede parar el camión al entregar?'), saltar: () => S.destinoNoSe},
  {id:'cuando', render: rCuando},
  {id:'fotos', render: rFotos},
  {id:'datos', render: rDatos},
  {id:'repaso', render: rRepaso, ultimo:true},
  {id:'hecho', render: rHecho, sinBarra:true, final:true},
];
const visibles = () => PASOS.filter(p => !p.sinBarra && !(p.saltar && p.saltar()));
const idx = id => PASOS.findIndex(p => p.id === id);

function ir(n, {historial = true} = {}) {
  paso = Math.max(0, Math.min(PASOS.length - 1, n));
  if (historial) history.pushState({paso}, '', '');
  pintar();
}
function siguiente() {
  if (PASOS[paso].id === 'datos' && !datosOk(true)) { ($('f-nombre').value.trim().length < 2 ? $('f-nombre') : $('f-tel')).focus(); return; }
  let n = paso + 1;
  while (PASOS[n] && PASOS[n].saltar && PASOS[n].saltar()) n++;
  if (desdeRepaso && (PASOS[paso].id === desdeRepaso || n > idx(desdeRepaso))) { desdeRepaso = ''; ir(idx('repaso')); return; }
  ir(n);
}
function anterior() {
  if (history.state && history.state.paso > 0) { history.back(); return; }
  let n = paso - 1;
  while (n > 0 && PASOS[n].saltar && PASOS[n].saltar()) n--;
  ir(n, {historial:false});
}
window.addEventListener('popstate', e => {
  if (PASOS[paso] && PASOS[paso].final) { history.pushState({paso}, '', ''); return; }   // ya enviado: no volver
  desdeRepaso = '';
  paso = (e.state && e.state.paso) || 0; pintar();
});

function pintar() {
  const p = PASOS[paso];
  const cont = $('step');
  cont.innerHTML = '';
  p.render(cont);
  // Barra de progreso
  const vis = visibles(), i = vis.indexOf(p);

let fid = 0;
async function anadirFotos(files) {
  const lista = [...files].filter(f => f.type.startsWith('image/') || /\.(heic|heif|jpe?g|png|webp)$/i.test(f.name)).slice(0, MAX_FOTOS - fotos.length);
  if (!lista.length) { if (fotos.length >= MAX_FOTOS) alert0(`Como máximo ${MAX_FOTOS} fotos. El resto mándalas por WhatsApp.`); return; }
  procesando += lista.length; pintarFotos();
  for (const f of lista) {
    try { fotos.push({id: ++fid, data: await reducir(f), nota: ''}); } catch (e) { alert0('Una foto no se ha podido abrir. Prueba con otra o mándala por WhatsApp.'); }
    procesando--; pintarFotos();
  }
}
['in-camera', 'in-gallery'].forEach(id => $(id).addEventListener('change', e => { anadirFotos(e.target.files); e.target.value = ''; }));
async function reducir(file) {
  let img, w, h;
  try { img = await createImageBitmap(file, {imageOrientation: 'from-image'}); w = img.width; h = img.height; }
  catch (e) {
    img = await new Promise((ok, ko) => { const i = new Image(); i.onload = () => ok(i); i.onerror = ko; i.src = URL.createObjectURL(file); });
    w = img.naturalWidth; h = img.naturalHeight;
  }
  const s = Math.min(1, LADO / Math.max(w, h));
  const c = document.createElement('canvas'); c.width = Math.round(w * s); c.height = Math.round(h * s);
  c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
  if (img.close) img.close();
  return c.toDataURL('image/jpeg', CALIDAD);
}

  const vacio = {fotos:'Sin fotos (te las pediremos por WhatsApp)', muebles:'No has marcado ninguno'};
  cont.insertAdjacentHTML('beforeend', `<dl class="rev">${filas.map(([id, t, v]) => `
    <div class="rev-item"><div><dt>${esc(t)}</dt><dd class="${v ? '' : 'vacio'}">${esc(v || vacio[id] || 'Sin contestar')}</dd></div>
      <button type="button" data-ir="${id}" aria-label="Cambiar ${esc(t.toLowerCase())}">Cambiar</button></div>`).join('')}</dl>
    <div id="envio-error"></div>`);
  cont.querySelectorAll('[data-ir]').forEach(b => b.onclick = () => { desdeRepaso = HASTA[b.dataset.ir] || b.dataset.ir; ir(idx(b.dataset.ir)); });
}

function rHecho(cont) {
  const n = esc((S.nombre || '').trim().split(' ')[0]);
  cont.innerHTML = `
    <div class="hero done">
      <div class="big" aria-hidden="true">✅</div>
      <h1>¡Recibido${n ? ', ' + n : ''}!</h1>
      <p class="help">Te escribimos por WhatsApp al <strong>${esc(S.telefono)}</strong> con el presupuesto, normalmente en el mismo día.</p>
      ${S.fotosWhatsapp || !fotos.length ? `<p class="help">Si tienes fotos de los muebles, mándanoslas por WhatsApp y te damos el precio antes.</p>` : ''}
      <p class="help"><strong>¿Te has dejado algo o te has equivocado?</strong> No hace falta enviarla otra vez: dínoslo por WhatsApp y lo cambiamos.</p>
      <a class="btn btn-wa btn-block" href="${waLink(`Hola, soy ${(S.nombre || '').trim()}. Acabo de pedir presupuesto en la web 🙂`)}" target="_blank" rel="noopener">💬 Abrir WhatsApp</a>
    </div>
    <p class="slogan">«Cambia de casa, no de humor»</p>`;
}

// ── Envío ──
async function enviar() {
  if (enviando) return;
  if (!datosOk(false)) { desdeRepaso = 'datos'; ir(idx('datos')); return; }
  enviando = true;
  $('sending-txt').textContent = fotos.length ? `Enviando tu solicitud y ${fotos.length} foto${fotos.length > 1 ? 's' : ''}…` : 'Enviando tu solicitud…';
  $('sending').classList.add('on');
  const lado = d => ({poblacion: d.poblacion || '', calle: d.calle || '', piso: d.piso || '', ascensor: d.ascensor || '', aparcamiento: d.aparcamiento || ''});
  const detalles = {};
  Object.keys(S.muebles).forEach(k => { const t = (S.mueblesDetalle[k] || '').trim(); if (t) detalles[k] = t; });
  const body = {
    web: $('hp-web').value, t: Date.now() - T0,
    servicios: S.servicios, origen: lado(S.origen), destino: S.destinoNoSe ? {} : lado(S.destino),
    inventario: {casa: S.casa, muebles: S.muebles, detalles, otros: S.mueblesTexto, desmontaje: S.desmontaje, embalaje: S.embalaje, cajas: S.cajas, especiales: S.especiales},
    cuando: S.cuando, fecha: S.fecha, flexible: S.flexible, entrega: otroPueblo() ? S.entrega : '', fotos_whatsapp: S.fotosWhatsapp,
    nombre: S.nombre, telefono: S.telefono, comentario: S.comentario,
    fotos: fotos.map(f => ({data: f.data, nota: (f.nota || '').trim()})),
  };
  let error = '';
  try {
    const ctrl = new AbortController(); const to = setTimeout(() => ctrl.abort(), 90000);
    const r = await fetch(ENDPOINT, {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body), signal: ctrl.signal});
    clearTimeout(to);
    let j = {}; try { j = await r.json(); } catch (e) {}
    if (!r.ok || !j.ok) error = j.error || 'No se ha podido enviar.';
  } catch (e) { error = 'No hay conexión o ha tardado demasiado.'; }
  $('sending').classList.remove('on'); enviando = false;
  if (error) {
    $('envio-error').innerHTML = `<div class="alert" role="alert">${esc(error)} Vuelve a intentarlo o escríbenos:
      <a class="btn btn-wa btn-block" href="${waLink(WA_TXT)}" target="_blank" rel="noopener">💬 Escribir por WhatsApp</a></div>`;
    $('envio-error').scrollIntoView({behavior: 'smooth', block: 'center'});
    return;
  }
  const hecho = PASOS.findIndex(p => p.final);
  ir(hecho, {historial: false}); history.replaceState({paso: hecho}, '', '');
  try { localStorage.removeItem(KEY); } catch (e) {}
}

// ── Arranque ──
$('btn-next').onclick = () => PASOS[paso].ultimo ? enviar() : siguiente();
$('btn-back').onclick = () => { desdeRepaso = ''; anterior(); };
$('wa-help').href = waLink(WA_TXT);
history.replaceState({paso: 0}, '', '');
pintar();
})();
</script>
